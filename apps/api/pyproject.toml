[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novelova-api"
version = "0.1.0"
description = "Novelova FastAPI Backend Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "novelova-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
    "ruff>=0.4.0",
]

[tool.uv.sources]
novelova-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]

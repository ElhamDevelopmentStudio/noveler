[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novelova-api"
version = "0.1.0"
description = "Novelova FastAPI Backend Service with PostgreSQL & Scheduler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.8",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.38",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "apscheduler>=3.10.4",
    "novelova-core",
    "bcrypt>=5.0.0",
    "pyjwt>=2.15.1",
    "boto3>=1.43.108",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
]

[tool.uv.sources]
novelova-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]

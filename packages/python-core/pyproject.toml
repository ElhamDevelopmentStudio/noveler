[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novelova-core"
version = "0.1.0"
description = "Shared core utilities, base models, and logging for Novelova Python services"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["novelova_core"]

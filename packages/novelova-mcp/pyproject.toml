[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novelova-mcp"
version = "0.1.0"
description = "Novelova Model Context Protocol (MCP) Server for Autonomous Audiobook & Voice Drama Studio Production"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "novelova-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[project.scripts]
novelova-mcp = "novelova_mcp.server:main"

[tool.uv.sources]
novelova-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["novelova_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novelova-cli"
version = "0.1.0"
description = "Headless CLI and AI Agent Automation Suite for Novelova Studio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.9.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "novelova-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[project.scripts]
novelova = "novelova_cli.main:app"

[tool.uv.sources]
novelova-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/novelova_cli"]

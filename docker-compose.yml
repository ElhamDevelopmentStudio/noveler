version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - BACKEND_CORS_ORIGINS=["http://localhost:3000"]
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/python-core:/app/packages/python-core

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:80"
    depends_on:
      - api

[project]
name = "novelova"
version = "0.1.0"
description = "Novelova polyglot monorepo workspace"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/python-core",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501", # line-too-long handled by formatter
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
pythonpath = [
    "apps/api",
    "packages/python-core",
]
testpaths = [
    "apps/api/tests",
    "packages/python-core/tests",
]
